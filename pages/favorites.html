<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <script type="module">
        if (import.meta.env.DEV) {
            import("react-grab").then((m) => m.init({ "activationKey": { "key": " ", "altKey": false }, "activationMode": "toggle", "allowActivationInsideInput": true, "maxContextLines": 3 }));
            import("@react-grab/gemini/client");
        }
    </script>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>My Favorites - Seven Stitches</title>
    <link rel="icon" type="image/webp" href="/favicon-circle.webp" />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;900&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2563eb",
                        "background-light": "#f8fafc",
                        "background-dark": "#0f172a",
                    },
                    fontFamily: {
                        "display": ["Be Vietnam Pro", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" },
                },
            },
        }
    </script>
</head>

<body class="font-display bg-background-light dark:bg-background-dark text-[#0f172a] dark:text-[#e2e8f0]">
    <app-header></app-header>

    <main class="flex flex-col items-center w-full min-h-screen">
        <div class="w-full max-w-[1440px] px-4 md:px-10 py-4 md:py-8 lg:py-16 pb-24 md:pb-8">

            <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4 flex">
                <h1 class="text-3xl md:text-5xl font-black leading-tight tracking-tight">My Favorites</h1>
            </div>

            <div id="favorites-grid" class="grid grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6">
                <!-- Products will be injected here -->
                <p class="col-span-full text-center text-gray-500 py-20">Loading favorites...</p>
            </div>

            <div id="empty-state" class="hidden flex flex-col items-center justify-center py-20 text-center">
                <div class="size-24 bg-gray-100 dark:bg-gray-800 rounded-full flex items-center justify-center mb-6">
                    <span class="material-symbols-outlined text-4xl text-gray-400">favorite</span>
                </div>
                <h2 class="text-xl font-bold mb-2">No favorites yet</h2>
                <p class="text-gray-500 max-w-xs mx-auto mb-8">Start exploring and save items for later.</p>
                <a href="/pages/shop.html"
                    class="bg-black dark:bg-white text-white dark:text-black font-bold py-3 px-8 rounded-full hover:scale-105 transition-transform">Explore
                    Shop</a>
            </div>
        </div>
    </main>

    <script type="module" src="/src/pages/favorites.ts"></script>
</body>

</html>
