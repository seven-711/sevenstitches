<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <script type="module">
        if (import.meta.env.DEV) {
            import("react-grab").then((m) => m.init({ "activationKey": { "key": " ", "altKey": false }, "activationMode": "toggle", "allowActivationInsideInput": true, "maxContextLines": 3 }));
            import("@react-grab/gemini/client");
        }
    </script>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Shop - Seven Stitches</title>
    <link rel="icon" type="image/webp" href="/favicon-circle.webp" />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;900&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2563eb",
                        "background-light": "#f8fafc",
                        "background-dark": "#0f172a",
                    },
                    fontFamily: {
                        "display": ["Be Vietnam Pro", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" },
                },
            },
        }
    </script>
</head>

<body
    class="font-display bg-background-light dark:bg-background-dark text-[#0f172a] dark:text-[#e2e8f0] overflow-x-hidden">
    <app-header></app-header>

    <main class="flex flex-col items-center w-full min-h-screen">
        <div class="w-full max-w-[1440px] px-4 md:px-10 py-4 md:py-8 lg:py-16 pb-24 md:pb-8">
            <!-- Mobile Hero Card -->
            <div class="md:hidden w-full mb-8 animate-fade-in-up">
                <div id="mobile-promo-card"
                    class="relative w-full bg-[#1e293b] rounded-[2rem] p-6 overflow-hidden flex items-center min-h-[180px] shadow-2xl shadow-blue-900/20 transition-colors duration-500">
                    <!-- Background Decoration -->
                    <div class="absolute top-0 right-0 w-32 h-32 bg-white/5 rounded-full blur-3xl -mr-10 -mt-10"></div>
                    <div class="absolute bottom-0 left-0 w-24 h-24 bg-primary/20 rounded-full blur-2xl -ml-5 -mb-5">
                    </div>

                    <div id="mobile-promo-content"
                        class="relative z-10 flex flex-col items-start gap-4 max-w-[65%] transition-opacity duration-300">
                        <h2 class="text-white font-bold text-xl leading-snug">Flat 50% discount on your first order.
                        </h2>
                        <button
                            class="bg-[#f97316] text-white text-sm font-bold px-6 py-2.5 rounded-full shadow-lg shadow-orange-500/20 active:scale-95 transition-transform">Buy
                            Now</button>
                    </div>
                    <!-- Decorative Floating Image (Using a product image) -->
                    <img id="mobile-promo-image"
                        src="https://lh3.googleusercontent.com/aida-public/AB6AXuBPDk-3YDj-0t12k5qYBcBl3gWsAjjoPGNIXJsElwl5k07ckHUY5ikmiExZGN_gUkzjNCFVEA3rL3rBbH2ySG1MF54Uy0NdcN0a5LLMf3A84gul0EAtJTWlZd5pG5H_isGFn3pbkYDWr5B5cnsq9GMPXB34Vi3_HhFPpDTsFmTqCnI1Zah1mPDJwMqpilhJv2mWJ-MTvwrNy6x5KmUe2GzM4vyT2czlExkshQdusA0dAkTtZ0A1hZ5WiY1AIqIJrEdtoVOc5524m8Hv"
                        class="absolute -right-4 top-1/2 -translate-y-1/2 w-40 h-auto object-contain rotate-[-12deg] drop-shadow-2xl filter brightness-110 contrast-125 hover:scale-110 transition-transform duration-500"
                        alt="Featured Product">
                </div>
                <!-- Dots Indicator -->
                <div id="mobile-promo-dots" class="flex justify-center gap-1.5 mt-4">
                    <button class="w-1.5 h-1.5 rounded-full bg-primary transition-all duration-300"></button>
                    <button
                        class="w-1.5 h-1.5 rounded-full bg-gray-300 dark:bg-gray-700 transition-all duration-300"></button>
                    <button
                        class="w-1.5 h-1.5 rounded-full bg-gray-300 dark:bg-gray-700 transition-all duration-300"></button>
                </div>
            </div>

            <div class="hidden md:flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
                <h1 class="text-3xl md:text-5xl font-black leading-tight tracking-tight">Shop All Products</h1>

                <div class="flex items-center gap-2">
                    <label for="stock-filter"
                        class="text-sm font-medium text-gray-700 dark:text-gray-300">Filter:</label>
                    <select id="stock-filter"
                        class="rounded-lg border-gray-300 dark:border-gray-700 text-sm focus:ring-primary focus:border-primary bg-white dark:bg-[#1e293b]">
                        <option value="all">All Status</option>
                        <option value="in_stock">In Stock</option>
                        <option value="out_of_stock">Out of Stock</option>
                    </select>
                </div>
            </div>

            <!-- Category Filters -->
            <div class="flex items-center justify-between mb-4 md:mb-8">
                <h3 class="text-xl font-bold md:hidden">Categories</h3>
                <a href="#" class="text-xs font-bold text-gray-400 md:hidden hover:text-primary transition-colors">View
                    all</a>
            </div>

            <div id="category-filters"
                class="flex md:flex-wrap overflow-x-auto md:overflow-visible gap-3 mb-8 items-center md:justify-start pb-4 md:pb-0 -mx-4 px-4 md:mx-0 snap-x scrollbar-hide">
                <button
                    class="px-4 py-2 rounded-full text-sm font-medium bg-black text-white dark:bg-white dark:text-black transition-all">All</button>
                <div class="animate-pulse h-9 w-24 bg-gray-200 dark:bg-gray-800 rounded-full"></div>
                <div class="animate-pulse h-9 w-24 bg-gray-200 dark:bg-gray-800 rounded-full"></div>
            </div>

            <div id="product-grid" class="grid grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6">
                <!-- Products will be injected here -->
                <p class="col-span-full text-center text-gray-500">Loading products...</p>
            </div>
        </div>
    </main>

    <script type="module" src="/src/pages/shop.ts"></script>

</body>

</html>
